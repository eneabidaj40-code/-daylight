name: Deploy Daylight to GitHub Pages

# Preparing this file does not deploy anything. After reviewing it, enable
# Settings > Pages > Source: GitHub Actions and push your code to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-progress production deployment finish; queue the latest push.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and verify the Pages PWA
        env:
          # /daylight/ for a project site, / for USERNAME.github.io.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          npm run verify:pages

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
